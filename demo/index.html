<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise Meter</title>
<meta name="description" content="A tiny world model, running in your browser, watches a small physics world. Break the physics and watch how surprised it gets.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --ink: #eef0f2;
    --dim: #9aa0a8;
    --faint: #5a6068;
    --line: #23262b;
    --panel: #121418;
    --spike: #ffb454;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    font: 16px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { min-height: 100dvh; display: flex; justify-content: center; padding: clamp(16px, 3vw, 40px) clamp(16px, 3vw, 40px) 32px; }
  main { width: min(1240px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: clamp(20px, 3vw, 40px); align-items: start; }

  .stage-wrap { position: relative; width: 100%; aspect-ratio: 1; max-height: calc(100dvh - 2 * clamp(16px, 3vw, 40px)); max-width: calc(100dvh - 2 * clamp(16px, 3vw, 40px)); margin-inline: auto; border-radius: 14px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 1px var(--line); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #stage.grabbing { cursor: grabbing; }
  #caption { position: absolute; left: 16px; right: 16px; bottom: 14px; font-size: 15px; line-height: 1.35; color: var(--ink); text-shadow: 0 1px 12px #000, 0 0 2px #000; pointer-events: none; transition: opacity 240ms ease; }

  aside { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  h1 { font-size: 21px; line-height: 1.2; letter-spacing: -0.012em; font-weight: 600; margin: 0 0 6px; }
  .lede { margin: 0; color: var(--dim); font-size: 15px; }
  .lede a { color: var(--ink); text-underline-offset: 2px; }

  .meter { border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); padding: 14px 14px 10px; }
  .readout { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  #oneIn { font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -0.022em; }
  .meter small { display: block; color: var(--dim); font-size: 13px; margin-top: 2px; min-height: 2.8em; }
  #trace { display: block; width: 100%; height: 132px; margin-top: 10px; }

  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .views figure { margin: 0; }
  .views canvas { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; background: #000; box-shadow: 0 0 0 1px var(--line); }
  .views figcaption { font-size: 12.5px; color: var(--dim); margin-top: 6px; line-height: 1.25; }

  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 9px; padding: 10px 11px; text-align: left; cursor: pointer; transition: transform 120ms var(--ease-out), background-color 120ms ease, box-shadow 120ms ease; line-height: 1.25; -webkit-tap-highlight-color: transparent; }
  @media (hover: hover) and (pointer: fine) { button:hover { background: #191c21; box-shadow: inset 0 0 0 1px #33383f; } }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--ink); color: #0b0c0e; box-shadow: none; }
  button span { display: block; color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  button[aria-pressed="true"] span { color: #3a3f46; }
  .foot { font-size: 12.5px; color: var(--faint); margin: 0; }
  .foot a { color: var(--dim); text-underline-offset: 2px; }

  @media (max-width: 880px) {
    main { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    aside { display: contents; }
    .intro { order: -1; }
    .stage-wrap { max-height: none; max-width: none; }
    .meter { padding: 10px 12px 8px; }
    #oneIn { font-size: 30px; }
    .meter small { min-height: 2.8em; font-size: 12.5px; }
    #trace { height: 68px; margin-top: 6px; }
    .views { order: 2; }
    .foot { order: 3; }
    #caption { font-size: 14px; left: 12px; right: 12px; bottom: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    #caption { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="stage-wrap">
    <canvas id="stage" aria-label="A small physics world. Drag a ball to move it, tap a ball to delete it."></canvas>
    <div id="caption"></div>
  </div>
  <aside>
    <div class="intro">
      <h1>Surprise Meter</h1>
      <p class="lede">A small neural network learned this world from pixels. It is running on your machine, guessing every frame before it sees it. Break the physics and watch it stop believing you.</p>
    </div>
    <div class="meter" role="status" aria-live="off">
      <div class="readout"><span id="oneIn">1 in 2</span></div>
      <small id="meaning">Waiting for the model to load.</small>
      <canvas id="trace"></canvas>
    </div>
    <div class="views">
      <figure><canvas id="vSaw" width="32" height="32"></canvas><figcaption>What it saw</figcaption></figure>
      <figure><canvas id="vExp" width="32" height="32"></canvas><figcaption>What it expected</figcaption></figure>
      <figure><canvas id="vErr" width="32" height="32"></canvas><figcaption>Where it was wrong</figcaption></figure>
    </div>
    <div class="acts">
      <button id="aVanish"><b>Vanish in hiding</b><span>Delete a ball once it is behind a slab</span></button>
      <button id="aReverse"><b>Reverse</b><span>Everything turns around, no reason</span></button>
      <button id="aWalls" aria-pressed="false"><b>No walls</b><span>Balls leave the world</span></button>
      <button id="aFreeze" aria-pressed="false"><b>Freeze</b><span>Everything stops dead</span></button>
      <button id="aGhost" aria-pressed="false"><b>No collisions</b><span>Balls pass through each other</span></button>
      <button id="aNew"><b>New world</b><span>Fresh scene, memory cleared</span></button>
    </div>
    <p class="foot"><span id="status">Loading.</span> <a href="https://github.com/abhaymettu/surprise-meter">Code, data and the measured curves</a>.</p>
  </aside>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
